# Local stack: `docker compose up --build`, then point the app at http://<your-ip>:8080
services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      NODE_ENV: development
      MONGO_URL: mongodb://mongo:27017/royal_carrom
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  mongo-data:
  redis-data:
